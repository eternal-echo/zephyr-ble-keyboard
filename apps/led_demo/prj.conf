# LED Demo — 仅点亮 WS2812B，无键盘 / BLE
# 只依赖 led_control 模块，不启用 key_input。

# === Keyboard common modules ===
CONFIG_KEYBOARD_COMMON=y
CONFIG_KEYBOARD_COMMON_KEY_INPUT=n
CONFIG_KEYBOARD_COMMON_LED_CONTROL=y

# === LED strip for WS2812B ===
CONFIG_LED_STRIP=y
CONFIG_REGULATOR=y

# === Logging ===
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# === Heap / stack ===
CONFIG_HEAP_MEM_POOL_SIZE=4096