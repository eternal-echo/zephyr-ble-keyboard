# ESP32-C3-MINI (USB): WS2812 via UART0 TX=GPIO20, console via usb_serial
# No regulator — POWER_GATE disabled, led_power_enable() becomes no-op
CONFIG_DMA=y
CONFIG_DMA_ESP32=y
CONFIG_KEYBOARD_COMMON=y
CONFIG_KEYBOARD_COMMON_KEY_INPUT=n
CONFIG_KEYBOARD_COMMON_LED_CONTROL=y
CONFIG_KEYBOARD_COMMON_LED_CONTROL_POWER_GATE=n